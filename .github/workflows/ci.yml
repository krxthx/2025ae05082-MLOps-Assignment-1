name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Lint
        run: |
          python -m flake8 src tests --max-line-length=120 --extend-ignore=E203,W503
      - name: Download data
        run: |
          python src/data_download.py
      - name: Train (MLflow)
        run: |
          python src/train.py
      - name: Unit tests
        run: |
          pytest -q
      - name: Docker build
        run: |
          docker build -t heart-api:${{ github.sha }} .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics
          path: |
            models/metrics.json
            screenshots/
