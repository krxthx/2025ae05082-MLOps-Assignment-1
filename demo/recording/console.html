<!doctype html><html><head><meta charset="utf-8"><title>Heart Disease MLOps · Live workspace</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#121720;color:#dde6f3;font-family:-apple-system,BlinkMacSystemFont,Arial}header{height:82px;padding:22px 38px;background:#1c2330;border-bottom:1px solid #354155;display:flex;justify-content:space-between;align-items:center;font-size:25px}header small{font-size:18px;color:#91a2ba}.dot{display:inline-block;background:#72dba6;width:10px;height:10px;border-radius:50%;margin-right:12px}.layout{display:flex;height:calc(100vh - 82px)}nav{width:270px;padding:28px 20px;background:#171e29;border-right:1px solid #354155}nav h3{font-size:14px;letter-spacing:2px;color:#8799b3;margin:0 0 25px}nav a{display:block;padding:14px 12px;color:#a8b8ce;cursor:pointer;text-decoration:none;font-size:20px;border-radius:6px}nav a:hover,nav a.active{color:#fff;background:#2b394d}main{flex:1;min-width:0;padding:26px 34px;overflow:auto}#chapter{font-size:17px;color:#7fdcbd;text-transform:uppercase;letter-spacing:2px;margin-bottom:18px}#output{font:24px/1.4 Menlo,Monaco,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}form{display:flex;font:24px/1.4 Menlo,monospace;margin-top:12px}label{color:#7fdcbd;margin-right:15px;white-space:nowrap}input{width:100%;font:inherit;color:#fff;outline:none;background:none;border:0}#state{font-size:16px;color:#a8b8ce;padding-top:14px}pre.code{font:24px/1.48 Menlo,monospace;white-space:pre-wrap;margin:0;color:#d3e2f9}#cursor{position:fixed;pointer-events:none;z-index:2147483647;border:2px solid #7ddcbe;background:#7ddcbe33;border-radius:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
</style></head><body><header><span><span class="dot"></span>Heart Disease MLOps <small> / Assignment 01</small></span><small id="clock">Live local workspace</small></header><div class="layout"><nav><h3>PROJECT WORKSPACE</h3><a href="/" class="active">Terminal</a><a href="/file?name=preprocessing">Preprocessing</a><a href="/file?name=training">Model tuning</a><a href="/file?name=ci">GitHub Actions</a><a href="/file?name=docker">Dockerfile</a><a href="/file?name=kubernetes">Kubernetes</a><a href="/file?name=readme">README</a></nav><main><div id="chapter">End-to-end pipeline</div><pre id="output"></pre><form id="form"><label>heart-mlops %</label><input id="command" autofocus autocomplete="off" spellcheck="false"></form><div id="state">Commands execute in the assignment repository.</div><pre id="code" class="code"></pre></main></div><div id="cursor"></div><script>
const output=document.querySelector('#output'),input=document.querySelector('#command');let timer;const params=new URLSearchParams(location.search);const file=params.get('name');
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.href===location.href));
if(file){document.querySelector('#form').hidden=true;document.querySelector('#state').hidden=true;fetch('/source?name='+file).then(r=>r.text()).then(t=>{document.querySelector('#code').textContent=t;document.querySelector('#chapter').textContent=file;});}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const cmd=input.value;input.value='';input.disabled=true;document.querySelector('#state').textContent='Running…';output.textContent='heart-mlops % '+cmd+'\n\n';const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})});if(!r.ok){document.querySelector('#state').textContent=await r.text();input.disabled=false;return;}timer=setInterval(async()=>{const state=await(await fetch('/state')).json();output.textContent='heart-mlops % '+cmd+'\n\n'+state.output.split('\n').slice(-22).join('\n');document.querySelector('#state').textContent=state.done?'Completed · exit '+state.code:'Running…';if(state.done){clearInterval(timer);input.disabled=false;input.focus();}},180);};
document.addEventListener('mousemove',e=>{const c=document.querySelector('#cursor');c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';});
</script></body></html>
